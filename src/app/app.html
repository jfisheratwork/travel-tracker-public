<div class="max-w-6xl mx-auto px-3 py-4 md:px-6 md:py-6 relative">
  <!-- Page Title -->
  <h1 class="text-4xl font-extrabold text-stone-800 mb-6 tracking-tight">
    🌎 New Family Travel Tracker
  </h1>

  <div class="flex flex-wrap items-center gap-3 mb-6 border-b border-stone-200 pb-6 no-print">
    <app-global-search class="flex-1 min-w-[200px] max-w-md"></app-global-search>
    <button
      class="px-4 py-2.5 bg-green-50 text-green-700 border border-green-200 rounded-xl text-sm font-bold hover:bg-green-100 transition flex items-center gap-1.5 shadow-sm"
    >
      🌲 Add Parks
    </button>
    <button
      class="px-4 py-2.5 bg-blue-50 text-blue-700 border border-blue-200 rounded-xl text-sm font-bold hover:bg-blue-100 transition flex items-center gap-1.5 shadow-sm"
    >
      ⭐ Add States
    </button>
    <!-- Spacer -->
    <div class="flex-1"></div>
    <button
      (click)="showSettingsModal = true"
      class="px-3 py-2.5 bg-white text-stone-600 border border-stone-200 rounded-xl text-sm font-bold hover:bg-stone-50 transition flex items-center gap-1.5 shadow-sm"
      title="Settings"
    >
      ⚙️
    </button>
  </div>

  <!-- Main Display Container: Stacked Map and Route Builder -->
  <div class="flex flex-col gap-6">
    <!-- Map Area -->
    <div
      class="w-full h-[600px] bg-white rounded-xl shadow-lg border border-stone-200 relative overflow-hidden"
    >
      <app-map-view #mapView></app-map-view>
    </div>

    <!-- Route Builder Underneath -->
    <div
      *ngIf="stateService.mapMode$ | async as mode"
      class="w-full bg-white rounded-xl shadow-lg border border-stone-200 flex-shrink-0"
      [class.hidden]="mode !== 'roads'"
    >
      <app-route-builder></app-route-builder>
    </div>
  </div>
</div>

<!-- Modals -->
<app-settings-modal
  *ngIf="showSettingsModal"
  (close)="showSettingsModal = false"
></app-settings-modal>

<app-toast-container></app-toast-container>
<app-loading-spinner></app-loading-spinner>
