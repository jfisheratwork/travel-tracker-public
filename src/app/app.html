<div
  class="w-full max-w-[96vw] 2xl:max-w-[1700px] mx-auto px-2 py-3 sm:px-4 md:py-4 relative flex flex-col min-h-screen"
>
  <!-- Page Title (Bordered title bar with centered title and profile placeholder on right) -->
  <div
    class="w-full flex items-center justify-between py-2 sm:py-2.5 px-4 sm:px-6 rounded-2xl shadow-sm mb-3 transition-colors duration-200"
    [style.backgroundColor]="currentTheme.headerBg"
    [style.borderColor]="currentTheme.headerBorder"
    style="border-width: 2px; border-style: solid"
  >
    <!-- Left spacer balancing the profile widget on desktop to keep title centered -->
    <div class="w-10 sm:w-36 hidden sm:block"></div>

    <!-- Centered Title -->
    <h1
      class="text-xl sm:text-2xl md:text-3xl font-extrabold tracking-tight m-0 text-center flex-1 transition-colors duration-200"
      [style.color]="currentTheme.headerText"
    >
      Family Tracker
    </h1>

    <!-- Right Profile Widget & Dropdown -->
    <div class="relative sm:w-36 flex justify-end" #profileMenuRef>
      <button
        (click)="toggleProfileMenu()"
        class="flex items-center gap-2 py-1 px-2 sm:px-2.5 rounded-full transition-all active:scale-95 border"
        [style.borderColor]="currentTheme.headerBorder"
        [style.backgroundColor]="
          currentTheme.isDark ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.18)'
        "
        title="User Profile"
        aria-label="User Profile Menu"
      >
        <div
          class="w-7 h-7 rounded-full flex items-center justify-center font-bold text-xs text-white shadow-xs"
          [style.backgroundColor]="currentTheme.accent"
        >
          TU
        </div>
        <span
          class="text-xs font-semibold hidden md:inline-block"
          [style.color]="currentTheme.headerText"
        >
          Test User
        </span>
        <svg
          class="w-3.5 h-3.5 transition-transform"
          [class.rotate-180]="showProfileMenu"
          [style.color]="currentTheme.headerText"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- Profile Dropdown Menu -->
      <div
        *ngIf="showProfileMenu"
        class="absolute right-0 top-full mt-2 w-60 bg-white rounded-2xl shadow-2xl border border-stone-200 py-3 px-3.5 z-[1200] animate-fadeIn text-stone-800"
      >
        <div class="flex items-center gap-2.5 pb-2.5 mb-2.5 border-b border-stone-100">
          <div
            class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-xs text-white shadow-xs"
            [style.backgroundColor]="currentTheme.accent"
          >
            TU
          </div>
          <div class="flex flex-col min-w-0 text-left">
            <span class="text-sm font-bold text-stone-900 truncate">Test User</span>
            <span class="text-[11px] text-stone-500 truncate">testuser&#64;example.com</span>
          </div>
        </div>
        <div
          class="px-2.5 py-2 bg-amber-50 rounded-xl border border-amber-200 text-amber-800 text-xs font-medium flex items-center gap-2"
        >
          <span class="text-sm">🚧</span>
          <span>In progress</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Display Container: Stacked Map and Details Drawer -->
  <div class="flex flex-col gap-4">
    <!-- Map Area (Uses full vertical and horizontal screen real estate with thick rounded border) -->
    <div
      class="w-full h-[75vh] min-h-[550px] xl:h-[78vh] rounded-2xl md:rounded-3xl shadow-xl relative overflow-hidden transition-colors duration-200"
      [style.backgroundColor]="currentTheme.cardBg"
      [style.borderColor]="currentTheme.cardBorder"
      style="border-width: 3.5px; border-style: solid"
    >
      <app-map-view #mapView (settingsClick)="showSettingsModal = true"></app-map-view>
    </div>

    <!-- Show / Hide Details Drawer Toggle Button -->
    <div *ngIf="stateService.mapMode$ | async as mode" class="flex justify-center -mt-1">
      <button
        (click)="showDetailsDrawer = !showDetailsDrawer"
        class="flex items-center gap-2 px-6 py-2 rounded-full font-bold text-sm shadow-sm hover:opacity-90 transition-all active:scale-95"
        [style.backgroundColor]="currentTheme.buttonBg"
        [style.borderColor]="currentTheme.buttonBorder"
        [style.color]="currentTheme.buttonText"
        style="border-width: 1.5px; border-style: solid"
      >
        <span>{{ showDetailsDrawer ? '▼ Hide Details' : '▲ Show Details' }}</span>
        <span class="text-xs opacity-60 font-normal">
          ({{
            mode === 'roads' ? 'Road Trips' : mode === 'parks' ? 'Visited Parks' : 'Visited States'
          }})
        </span>
      </button>
    </div>

    <!-- Active Mode Content Drawer -->
    <div
      *ngIf="showDetailsDrawer && (stateService.mapMode$ | async) as mode"
      class="w-full flex-shrink-0 transition-all duration-300 animate-fadeIn"
    >
      <div
        *ngIf="mode === 'roads'"
        class="rounded-xl shadow-lg overflow-hidden transition-colors duration-200"
        [style.backgroundColor]="currentTheme.cardBg"
        [style.borderColor]="currentTheme.cardBorder"
        style="border-width: 1px; border-style: solid"
      >
        <app-route-builder></app-route-builder>
      </div>
      <app-locations-tracker *ngIf="mode === 'parks' || mode === 'states'"></app-locations-tracker>
    </div>
  </div>

  <!-- Attribution Footer with GitHub link -->
  <footer
    class="mt-auto pt-8 pb-4 text-xs flex flex-col sm:flex-row items-center justify-between gap-2 px-2 transition-colors duration-200"
    [style.borderTopColor]="currentTheme.cardBorder"
    [style.color]="currentTheme.isDark ? '#94a3b8' : '#78716c'"
    style="border-top-width: 1px; border-top-style: solid"
  >
    <div class="flex items-center gap-2">
      <span class="font-semibold" [style.color]="currentTheme.isDark ? '#f1f5f9' : '#44403c'"
        >Family Tracker</span
      >
      <span>&bull;</span>
      <span>Explore National Parks, States &amp; Road Trips</span>
    </div>
    <div class="flex items-center gap-3 sm:gap-4">
      <span class="italic font-serif opacity-70 text-xs tracking-wide">
        Made for fun by Jake Fisher
      </span>
      <span class="opacity-40 hidden sm:inline">&bull;</span>
      <a
        href="https://github.com/jfisheratwork/travel-tracker-public"
        target="_blank"
        rel="noopener noreferrer"
        class="hover:opacity-100 transition flex items-center gap-1.5 font-medium"
        [style.color]="currentTheme.isDark ? '#e2e8f0' : '#44403c'"
      >
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
            clip-rule="evenodd"
          ></path>
        </svg>
        GitHub Repository
      </a>
    </div>
  </footer>
</div>

<!-- Modals -->
<app-settings-modal
  *ngIf="showSettingsModal"
  (close)="showSettingsModal = false"
></app-settings-modal>

<app-location-detail-modal
  *ngIf="stateService.editingLocation$ | async as editingLoc"
  [locationId]="editingLoc.id"
  [mode]="editingLoc.mode"
  (close)="stateService.setEditingLocation(null)"
></app-location-detail-modal>

<app-toast-container></app-toast-container>
<app-loading-spinner></app-loading-spinner>
