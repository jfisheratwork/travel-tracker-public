<div class="w-full max-w-[96vw] 2xl:max-w-[1700px] mx-auto px-2 py-3 sm:px-4 md:py-4 relative flex flex-col min-h-screen">
  <!-- Page Title (Centered with light rounded border, no globe) -->
  <div class="flex justify-center items-center mb-3">
    <div class="inline-flex items-center px-6 py-1.5 bg-white/90 border border-stone-200 rounded-2xl shadow-xs">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-stone-800 tracking-tight m-0">
        Family Tracker
      </h1>
    </div>
  </div>

  <!-- Mode Selector Tabs (Above Map) -->
  <div *ngIf="stateService.mapMode$ | async as mode" class="flex gap-2 max-w-xl mx-auto w-full mb-3">
    <button
      (click)="stateService.setMapMode('roads')"
      [class.bg-blue-600]="mode === 'roads'"
      [class.text-white]="mode === 'roads'"
      [class.bg-white]="mode !== 'roads'"
      [class.text-stone-600]="mode !== 'roads'"
      class="flex-1 py-2 px-4 rounded-xl text-sm font-bold shadow-xs transition border border-stone-200 hover:border-stone-300"
    >
      🚗 Routes
    </button>
    <button
      (click)="stateService.setMapMode('parks')"
      [class.bg-green-700]="mode === 'parks'"
      [class.text-white]="mode === 'parks'"
      [class.bg-white]="mode !== 'parks'"
      [class.text-stone-600]="mode !== 'parks'"
      class="flex-1 py-2 px-4 rounded-xl text-sm font-bold shadow-xs transition border border-stone-200 hover:border-stone-300"
    >
      🌲 Parks
    </button>
    <button
      (click)="stateService.setMapMode('states')"
      [class.bg-indigo-600]="mode === 'states'"
      [class.text-white]="mode === 'states'"
      [class.bg-white]="mode !== 'states'"
      [class.text-stone-600]="mode !== 'states'"
      class="flex-1 py-2 px-4 rounded-xl text-sm font-bold shadow-xs transition border border-stone-200 hover:border-stone-300"
    >
      ⭐ States
    </button>
  </div>

  <!-- Main Display Container: Stacked Map and Details Drawer -->
  <div class="flex flex-col gap-4">
    <!-- Map Area (Uses full vertical and horizontal screen real estate) -->
    <div
      class="w-full h-[75vh] min-h-[550px] xl:h-[78vh] bg-white rounded-xl shadow-lg border border-stone-200 relative overflow-hidden"
    >
      <app-map-view #mapView (settingsClick)="showSettingsModal = true"></app-map-view>
    </div>

    <!-- Show / Hide Details Drawer Toggle Button -->
    <div *ngIf="stateService.mapMode$ | async as mode" class="flex justify-center -mt-1">
      <button
        (click)="showDetailsDrawer = !showDetailsDrawer"
        class="flex items-center gap-2 px-6 py-2 bg-white text-stone-700 border border-stone-200 rounded-full font-bold text-sm shadow-sm hover:bg-stone-50 hover:border-stone-300 transition-all active:scale-95"
      >
        <span>{{ showDetailsDrawer ? '▲ Hide Details' : '▼ Show Details' }}</span>
        <span class="text-xs text-stone-400 font-normal">
          ({{ mode === 'roads' ? 'Road Trips' : (mode === 'parks' ? 'Visited Parks' : 'Visited States') }})
        </span>
      </button>
    </div>

    <!-- Active Mode Content Drawer -->
    <div
      *ngIf="showDetailsDrawer && (stateService.mapMode$ | async) as mode"
      class="w-full flex-shrink-0 transition-all duration-300 animate-fadeIn"
    >
      <div
        *ngIf="mode === 'roads'"
        class="bg-white rounded-xl shadow-lg border border-stone-200 overflow-hidden"
      >
        <app-route-builder></app-route-builder>
      </div>
      <app-locations-tracker *ngIf="mode === 'parks' || mode === 'states'"></app-locations-tracker>
    </div>
  </div>

  <!-- Attribution Footer with GitHub link -->
  <footer
    class="mt-auto pt-8 pb-4 border-t border-stone-200 text-xs text-stone-500 flex flex-col sm:flex-row items-center justify-between gap-2 px-2"
  >
    <div class="flex items-center gap-2">
      <span class="font-semibold text-stone-700">Family Tracker</span>
      <span>&bull;</span>
      <span>Explore National Parks, States &amp; Road Trips</span>
    </div>
    <div class="flex items-center gap-4">
      <a
        href="https://github.com/jfisheratwork/travel-tracker-public"
        target="_blank"
        rel="noopener noreferrer"
        class="hover:text-stone-800 transition flex items-center gap-1.5 font-medium text-stone-600"
      >
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
            clip-rule="evenodd"
          ></path>
        </svg>
        GitHub Repository
      </a>
    </div>
  </footer>
</div>

<!-- Modals -->
<app-settings-modal
  *ngIf="showSettingsModal"
  (close)="showSettingsModal = false"
></app-settings-modal>

<app-location-detail-modal
  *ngIf="stateService.editingLocation$ | async as editingLoc"
  [locationId]="editingLoc.id"
  [mode]="editingLoc.mode"
  (close)="stateService.setEditingLocation(null)"
></app-location-detail-modal>

<app-toast-container></app-toast-container>
<app-loading-spinner></app-loading-spinner>
