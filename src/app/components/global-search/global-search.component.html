<div class="relative w-full">
  <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-stone-400">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.3-4.3" />
    </svg>
  </span>
  <input
    type="text"
    [formControl]="searchControl"
    placeholder="Search by name or member..."
    class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-stone-200 text-sm outline-none focus:border-green-600 transition-all bg-white shadow-sm font-medium"
  />
  @if (searchControl.value) {
    <span class="absolute inset-y-0 right-0 flex items-center pr-3">
      <button
        (click)="clearSearch()"
        class="text-stone-300 hover:text-stone-600 transition"
        title="Clear search"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </span>
  }
</div>
