<div class="relative flex items-center">
  @if (!showInput) {
    <!-- Collapsed Search Icon Trigger Button -->
    <button
      type="button"
      (click)="expand()"
      class="h-8 w-8 sm:h-9 sm:w-9 rounded-xl transition-all flex items-center justify-center shadow-xs active:scale-95 border cursor-pointer flex-shrink-0 bg-white/20 hover:bg-white/30 border-white/30 text-current"
      title="Search by name or member..."
      aria-label="Open Search"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-4 h-4 sm:w-4.5 sm:h-4.5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
    </button>
  } @else {
    <!-- Expanded Search Input Container -->
    <div
      class="relative flex items-center animate-fadeIn transition-all duration-200"
      [class.w-full]="forceExpanded"
      [class.w-48]="!forceExpanded"
      [class.sm:w-56]="!forceExpanded"
      [class.md:w-64]="!forceExpanded"
    >
      <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 pointer-events-none text-stone-400">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
      </span>
      <input
        #searchInput
        type="text"
        [formControl]="searchControl"
        placeholder="Search by name or member..."
        (keydown.escape)="collapse()"
        class="w-full pl-8 pr-14 h-8 sm:h-9 rounded-xl border border-stone-200 text-xs sm:text-sm outline-none focus:border-green-600 transition-all bg-white shadow-xs font-medium text-stone-900 placeholder:text-stone-400"
      />
      <div class="absolute inset-y-0 right-0 flex items-center pr-1.5 gap-0.5">
        @if (searchControl.value) {
          <button
            type="button"
            (click)="clearSearch()"
            class="p-1 text-stone-400 hover:text-stone-700 transition cursor-pointer"
            title="Clear search"
            aria-label="Clear search"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-3.5 h-3.5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        }
        @if (!forceExpanded) {
          <button
            type="button"
            (click)="collapse()"
            class="p-1 text-stone-400 hover:text-stone-700 transition cursor-pointer"
            title="Close search"
            aria-label="Close search"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-3.5 h-3.5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        }
      </div>
    </div>
  }
</div>
