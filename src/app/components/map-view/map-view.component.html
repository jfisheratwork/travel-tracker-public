<div class="flex flex-col h-full bg-white relative">
  <!-- Top Bar -->
  <div
    class="flex flex-wrap justify-between items-center gap-3 p-4 border-b border-stone-100 z-[1000] bg-white relative"
  >
    <div class="flex flex-wrap items-center gap-3 flex-1 min-w-[280px]">
      <app-global-search class="w-full sm:w-auto sm:flex-1 max-w-sm"></app-global-search>
      <button
        (click)="openParksModal()"
        class="px-4 py-2.5 bg-green-50 text-green-700 border border-green-200 rounded-xl text-sm font-bold hover:bg-green-100 transition flex items-center gap-1.5 shadow-sm whitespace-nowrap active:scale-95"
      >
        🌲 Add Parks
      </button>
      <button
        (click)="openStatesModal()"
        class="px-4 py-2.5 bg-blue-50 text-blue-700 border border-blue-200 rounded-xl text-sm font-bold hover:bg-blue-100 transition flex items-center gap-1.5 shadow-sm whitespace-nowrap active:scale-95"
      >
        ⭐ Add States
      </button>
      <button
        (click)="openRoads()"
        class="px-4 py-2.5 bg-amber-50 text-amber-800 border border-amber-200 rounded-xl text-sm font-bold hover:bg-amber-100 transition flex items-center gap-1.5 shadow-sm whitespace-nowrap active:scale-95"
      >
        🚗 Add Roads
      </button>
    </div>
    <div class="flex items-center gap-2">
      <button
        (click)="showStatsModal = true"
        class="px-4 py-2 border border-stone-200 hover:bg-stone-50 rounded-lg text-sm font-bold text-stone-600 transition flex items-center gap-1.5 shadow-sm whitespace-nowrap active:scale-95"
      >
        📊 Show Statistics
      </button>
      <button
        (click)="openSettings()"
        class="px-3 py-2 border border-stone-200 hover:bg-stone-50 rounded-lg text-sm font-bold text-stone-600 transition flex items-center justify-center shadow-sm active:scale-95"
        title="Settings"
      >
        ⚙️
      </button>
    </div>
  </div>

  <app-stats-modal *ngIf="showStatsModal" (close)="showStatsModal = false"></app-stats-modal>
  <app-parks-states-modal
    *ngIf="showParksStatesModal"
    [mode]="parksStatesModalMode"
    (close)="showParksStatesModal = false"
  ></app-parks-states-modal>

  <!-- Map -->
  <div id="map" class="flex-1 w-full z-0"></div>

  <!-- Legend -->
  <div class="p-3 border-t border-stone-100 bg-white z-[1000] relative">
    <div class="flex gap-6 justify-center text-sm font-medium text-stone-600">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-green-600"></span> All Visited
      </div>
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-yellow-500"></span> Partially Visited
      </div>
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-stone-400"></span> Not Visited
      </div>
    </div>
  </div>
</div>
