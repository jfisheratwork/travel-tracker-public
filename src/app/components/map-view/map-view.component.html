<div class="flex flex-col h-full relative" [style.backgroundColor]="currentTheme.cardBg">
  <!-- Top Bar -->
  <div
    class="flex flex-wrap justify-between items-center gap-4 p-3.5 border-b z-[1000] relative transition-colors duration-200"
    [style.backgroundColor]="currentTheme.cardBg"
    [style.borderBottomColor]="currentTheme.cardBorder"
  >
    <!-- Left: Global Search -->
    <div class="flex items-center min-w-[220px] max-w-xs flex-1">
      <app-global-search class="w-full"></app-global-search>
    </div>

    <!-- Center: Primary Actions -->
    <div class="flex items-center justify-center gap-2.5 flex-wrap">
      <button
        (click)="openParksModal()"
        class="h-10 px-4 bg-green-50 text-green-700 border border-green-200 rounded-xl text-sm font-bold hover:bg-green-100 transition flex items-center gap-1.5 shadow-xs whitespace-nowrap active:scale-95"
      >
        🌲 Add Parks
      </button>
      <button
        (click)="openStatesModal()"
        class="h-10 px-4 bg-blue-50 text-blue-700 border border-blue-200 rounded-xl text-sm font-bold hover:bg-blue-100 transition flex items-center gap-1.5 shadow-xs whitespace-nowrap active:scale-95"
      >
        ⭐ Add States
      </button>
      <button
        (click)="openRoads()"
        class="h-10 px-4 bg-amber-50 text-amber-800 border border-amber-200 rounded-xl text-sm font-bold hover:bg-amber-100 transition flex items-center gap-1.5 shadow-xs whitespace-nowrap active:scale-95"
      >
        🚗 Add Roads
      </button>
    </div>

    <!-- Right: Utility Tools -->
    <div class="flex items-center justify-end gap-2 min-w-[220px] flex-1">
      <button
        (click)="showStatsModal = true"
        class="h-10 px-4 border border-stone-200 hover:bg-stone-50 rounded-xl text-sm font-bold text-stone-600 transition flex items-center gap-1.5 shadow-xs whitespace-nowrap active:scale-95"
      >
        📊 Show Statistics
      </button>

      <!-- Color Wheel Theme Selector Dropdown -->
      <div class="relative" #themeMenuRef>
        <button
          (click)="toggleThemeMenu()"
          class="h-10 w-10 border border-stone-200 hover:bg-stone-50 rounded-xl text-stone-600 transition flex items-center justify-center shadow-xs active:scale-95"
          [class.ring-2]="showThemeMenu"
          [class.ring-stone-400]="showThemeMenu"
          title="Color Theme"
          aria-label="Select Color Theme"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 text-stone-600"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle>
            <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle>
            <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle>
            <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle>
            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <div
          *ngIf="showThemeMenu"
          class="absolute right-0 mt-2 w-72 bg-white rounded-2xl shadow-2xl border border-stone-200 py-2 z-[1100] animate-fadeIn"
        >
          <div class="px-3.5 py-2 border-b border-stone-100 flex items-center justify-between">
            <span class="text-xs font-bold uppercase tracking-wider text-stone-500">Color Themes</span>
            <span class="text-[10px] text-stone-400 font-medium">8 options</span>
          </div>

          <div class="max-h-80 overflow-y-auto py-1">
            <button
              *ngFor="let t of availableThemes"
              (click)="selectTheme(t.id)"
              class="w-full px-3.5 py-2.5 flex items-center justify-between hover:bg-stone-50 transition text-left group"
              [class.bg-stone-50]="currentThemeId === t.id"
            >
              <div class="flex items-center gap-3 min-w-0">
                <!-- 3 Swatch Dots Preview -->
                <div class="flex items-center -space-x-1.5 flex-shrink-0">
                  <span class="w-4 h-4 rounded-full border border-white shadow-xs" [style.backgroundColor]="t.swatches[0]"></span>
                  <span class="w-4 h-4 rounded-full border border-white shadow-xs" [style.backgroundColor]="t.swatches[1]"></span>
                  <span class="w-4 h-4 rounded-full border border-white shadow-xs" [style.backgroundColor]="t.swatches[2]"></span>
                </div>
                <div class="flex flex-col min-w-0">
                  <span
                    class="text-sm font-semibold text-stone-800 truncate group-hover:text-stone-900"
                    [class.text-green-700]="currentThemeId === t.id"
                  >
                    {{ t.name }}
                  </span>
                  <span *ngIf="t.id === 'dunes-deep-lake'" class="text-[10px] text-amber-600 font-bold leading-none mt-0.5">
                    Default
                  </span>
                </div>
              </div>

              <!-- Checkmark when active -->
              <svg *ngIf="currentThemeId === t.id" class="w-4 h-4 text-green-600 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <button
        (click)="openSettings()"
        class="h-10 w-10 border border-stone-200 hover:bg-stone-50 rounded-xl text-stone-600 transition flex items-center justify-center shadow-xs active:scale-95"
        title="Settings"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-stone-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </button>
      <button
        (click)="showHelpModal = true"
        class="h-10 w-10 border border-stone-200 hover:bg-stone-50 rounded-xl text-stone-600 transition flex items-center justify-center shadow-xs active:scale-95"
        title="Help & Information"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-stone-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3" />
          <line x1="12" y1="17" x2="12.01" y2="17" stroke-linecap="round" stroke-width="2" />
        </svg>
      </button>
    </div>
  </div>

  <app-stats-modal *ngIf="showStatsModal" (close)="showStatsModal = false"></app-stats-modal>
  <app-parks-states-modal
    *ngIf="showParksStatesModal"
    [mode]="parksStatesModalMode"
    (close)="showParksStatesModal = false"
  ></app-parks-states-modal>
  <app-help-modal *ngIf="showHelpModal" (close)="showHelpModal = false"></app-help-modal>

  <!-- Map + Right-side Vertical Key -->
  <div class="flex-1 flex w-full relative min-h-0 overflow-hidden">
    <div id="map" class="flex-1 h-full z-0"></div>

    <!-- Right-side Visited Legend -->
    <div
      class="absolute right-3 top-1/2 -translate-y-1/2 z-[1000] bg-white/95 backdrop-blur-xs border border-stone-200 rounded-2xl shadow-md py-3 px-3.5 flex flex-col gap-2.5 text-stone-700 select-none no-print"
    >
      <div
        class="text-[10px] font-extrabold text-stone-400 uppercase tracking-wider text-center"
      >
        VISITED
      </div>

      <div class="w-full h-px bg-stone-200"></div>

      <!-- All -->
      <div class="flex items-center gap-2 cursor-default" title="All Visited">
        <span class="w-2.5 h-2.5 rounded-full bg-green-600 ring-2 ring-green-100 shadow-xs"></span>
        <span class="text-xs font-semibold text-stone-700">All</span>
      </div>

      <!-- Some -->
      <div class="flex items-center gap-2 cursor-default" title="Partially Visited">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-500 ring-2 ring-amber-100 shadow-xs"></span>
        <span class="text-xs font-semibold text-stone-700">Some</span>
      </div>

      <!-- None -->
      <div class="flex items-center gap-2 cursor-default" title="Not Visited">
        <span class="w-2.5 h-2.5 rounded-full bg-stone-400 ring-2 ring-stone-100 shadow-xs"></span>
        <span class="text-xs font-semibold text-stone-700">None</span>
      </div>
    </div>
  </div>

  <!-- Bottom Bar: Mirrored Mode Tabs (Routes, Parks, States) -->
  <div class="p-2.5 border-t border-stone-100 bg-white z-[1000] relative flex justify-center">
    <div class="flex gap-2 max-w-xl w-full">
      <button
        (click)="setMapMode('roads')"
        [class.bg-blue-600]="mapMode === 'roads'"
        [class.text-white]="mapMode === 'roads'"
        [class.bg-stone-50]="mapMode !== 'roads'"
        [class.text-stone-600]="mapMode !== 'roads'"
        class="flex-1 py-2 px-4 rounded-xl text-sm font-bold shadow-xs transition border border-stone-200 hover:border-stone-300 active:scale-95"
      >
        🚗 Routes
      </button>
      <button
        (click)="setMapMode('parks')"
        [class.bg-green-700]="mapMode === 'parks'"
        [class.text-white]="mapMode === 'parks'"
        [class.bg-stone-50]="mapMode !== 'parks'"
        [class.text-stone-600]="mapMode !== 'parks'"
        class="flex-1 py-2 px-4 rounded-xl text-sm font-bold shadow-xs transition border border-stone-200 hover:border-stone-300 active:scale-95"
      >
        🌲 Parks
      </button>
      <button
        (click)="setMapMode('states')"
        [class.bg-indigo-600]="mapMode === 'states'"
        [class.text-white]="mapMode === 'states'"
        [class.bg-stone-50]="mapMode !== 'states'"
        [class.text-stone-600]="mapMode !== 'states'"
        class="flex-1 py-2 px-4 rounded-xl text-sm font-bold shadow-xs transition border border-stone-200 hover:border-stone-300 active:scale-95"
      >
        ⭐ States
      </button>
    </div>
  </div>
</div>
