<div class="h-full w-full relative" [style.backgroundColor]="currentTheme.cardBg">
  <app-parks-states-modal
    *ngIf="showParksStatesModal"
    [mode]="parksStatesModalMode"
    (close)="showParksStatesModal = false"
  ></app-parks-states-modal>

  <!-- Map + Overlays (Stats Legend bottom-left, Visited Legend bottom-right) -->
  <div class="w-full h-full relative overflow-hidden">
    <div id="map" class="w-full h-full z-0"></div>

    <!-- Desktop Stats Legend (bottom-left) -->
    <app-map-stats-legend
      [theme]="currentTheme"
      [visitedUSStatesCount]="visitedUSStatesCount"
      [visitedCAProvincesCount]="visitedCAProvincesCount"
      [visitedUSParksCount]="visitedUSParksCount"
      [visitedCAParksCount]="visitedCAParksCount"
    ></app-map-stats-legend>

    <!-- Desktop Visited Legend (bottom-right) -->
    <app-map-visited-legend
      [theme]="currentTheme"
      [wantToVisitColor]="wantToVisitColor"
    ></app-map-visited-legend>

    <!-- Mobile Collapsible Legend Button & Popover (< md) -->
    <div class="md:hidden absolute bottom-3 left-3 z-[1000] flex flex-col items-start gap-2">
      <!-- Toggle Pill Button -->
      <button
        type="button"
        (click)="showMobileLegend = !showMobileLegend"
        class="h-8 px-3 rounded-full text-xs font-bold shadow-lg border flex items-center gap-1.5 backdrop-blur-md transition-all active:scale-95 cursor-pointer"
        [style.backgroundColor]="currentTheme.buttonBg"
        [style.borderColor]="currentTheme.buttonBorder"
        [style.color]="currentTheme.buttonText"
        aria-label="Toggle map legend and statistics"
      >
        <span>📊</span>
        <span>{{ showMobileLegend ? 'Hide Legend' : 'Legend & Stats' }}</span>
      </button>

      <!-- Collapsible Mobile Popover Sheet -->
      <div
        *ngIf="showMobileLegend"
        class="flex flex-col gap-2 p-2 rounded-2xl shadow-2xl border max-w-[280px] backdrop-blur-md animate-fadeIn"
        [style.backgroundColor]="currentTheme.cardBg"
        [style.borderColor]="currentTheme.cardBorder"
      >
        <app-map-stats-legend
          [inline]="true"
          [theme]="currentTheme"
          [visitedUSStatesCount]="visitedUSStatesCount"
          [visitedCAProvincesCount]="visitedCAProvincesCount"
          [visitedUSParksCount]="visitedUSParksCount"
          [visitedCAParksCount]="visitedCAParksCount"
        ></app-map-stats-legend>

        <app-map-visited-legend
          [inline]="true"
          [theme]="currentTheme"
          [wantToVisitColor]="wantToVisitColor"
        ></app-map-visited-legend>
      </div>
    </div>
  </div>
</div>
