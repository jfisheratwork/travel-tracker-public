<div class="h-full w-full relative" [style.backgroundColor]="currentTheme.cardBg">
  <app-parks-states-modal
    *ngIf="showParksStatesModal"
    [mode]="parksStatesModalMode"
    (close)="showParksStatesModal = false"
  ></app-parks-states-modal>

  <!-- Map + Overlays (Stats Legend bottom-left, Visited Legend bottom-right) -->
  <div class="w-full h-full relative overflow-hidden">
    <div id="map" class="w-full h-full z-0"></div>

    <app-map-stats-legend
      [theme]="currentTheme"
      [visitedUSStatesCount]="visitedUSStatesCount"
      [visitedCAProvincesCount]="visitedCAProvincesCount"
      [visitedUSParksCount]="visitedUSParksCount"
      [visitedCAParksCount]="visitedCAParksCount"
    ></app-map-stats-legend>

    <app-map-visited-legend
      [theme]="currentTheme"
      [wantToVisitColor]="wantToVisitColor"
    ></app-map-visited-legend>
  </div>
</div>
