id: no-hardcoded-credentials
message: 'Do not hardcode secrets, passwords, or API keys directly in source code.'
severity: error
language: typescript
ignores:
  - 'src/**/*.spec.ts'
rule:
  any:
    - pattern: "const $KEY = '$SECRET'"
      regex: '(?i)(api_?key|auth_?token|client_?secret|private_?key)'
    - pattern: "let $KEY = '$SECRET'"
      regex: '(?i)(api_?key|auth_?token|client_?secret|private_?key)'
    - pattern: "var $KEY = '$SECRET'"
      regex: '(?i)(api_?key|auth_?token|client_?secret|private_?key)'
