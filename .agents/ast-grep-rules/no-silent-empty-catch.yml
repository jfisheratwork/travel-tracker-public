id: no-silent-empty-catch
message: 'Do not swallow exceptions silently in empty catch blocks. Log with LoggerService.error() or rethrow to fail fast.'
severity: error
language: typescript
files:
  - 'src/**/*.ts'
rule:
  any:
    - pattern: |
        try {
          $$$TRY
        } catch ($PARAM) {
        }
    - pattern: |
        try {
          $$$TRY
        } catch {
        }
